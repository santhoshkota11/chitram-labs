<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Recipe tests</title>
<link rel="stylesheet" href="engine/fonts.css" />
<link rel="stylesheet" href="engine/kit.css" />
<script src="engine/vendor/gsap.min.js"></script>
<style>
#film{background:linear-gradient(160deg,#F4EFE3,#DDF5E6);font-family:"Manrope",sans-serif}
#line{left:760px;top:130px;font:600 64px/1.1 "Instrument Serif";color:#12372F}
.sq{position:absolute;left:-70px;top:-70px;width:140px;height:140px;border-radius:22px;background:linear-gradient(135deg,#10B981,#C7F36B)}
</style>
</head>
<body>
<div id="film" data-film data-duration="6" data-fps="30" data-width="1920" data-height="1080">
  <!-- 6.8 rosette bullet + typewriter + highlight -->
  <div id="bulletHost" style="position:absolute;left:700px;top:170px;width:0;height:0"></div>
  <div class="t" id="line" style="position:absolute">It’s how they <span id="landWord">land</span></div>
  <!-- 6.10 pill to ring -->
  <div id="pill" style="position:absolute;left:230px;top:500px;width:260px;height:80px;border-radius:40px;background:#C7F36B;opacity:0"></div>
  <div id="sparks" style="position:absolute;left:360px;top:540px;width:0;height:0"></div>
  <!-- 6.11 square releases rosette -->
  <div id="sqHost" style="position:absolute;left:960px;top:640px;width:0;height:0"><div class="sq" id="sq"></div></div>
  <!-- 6.6 phone -->
  <div id="phoneHost" class="layer" style="left:900px"></div>
  <!-- 6.3 glass assembly -->
  <div style="position:absolute;left:80px;top:700px;width:560px;height:300px;perspective:1800px">
    <div style="position:absolute;inset:0;transform-style:preserve-3d">
      <div class="glass" id="g1" style="position:absolute;left:0;top:0;width:560px;height:120px"></div>
      <div class="glass" id="g2" style="position:absolute;left:0;top:140px;width:270px;height:150px"></div>
      <div class="glass" id="g3" style="position:absolute;left:290px;top:140px;width:270px;height:150px"></div>
    </div>
  </div>
</div>
<script src="engine/runtime.js"></script>
<script src="engine/motion-kit.js"></script>
<script>
Film.build((tl) => {
  let T = 0.2;
  const r = MK.rosette("#bulletHost", { size: 90 });
  tl.fromTo(r, { x: -700, rotation: 0, opacity: 0 }, { x: 0, rotation: 420, opacity: 1, duration: 1.1, ease: "power3.out" }, T);
  const end = MK.typewriter(tl, "#line", T + .9, { cps: 18 });
  MK.highlight(tl, "#landWord", end + .1, { bg: "linear-gradient(90deg,#C7F36B,#10B981)" });

  T = 0.5;
  tl.fromTo("#pill", { opacity: 0, scale: .6 }, { opacity: 1, scale: 1, duration: .4, ease: "back.out(2)" }, T);
  tl.to("#pill", { width: 160, height: 160, left: 280, top: 460, borderRadius: 80, backgroundColor: "rgba(199,243,107,0)",
    boxShadow: "inset 0 0 0 10px #C7F36B", duration: .6, ease: "power3.inOut" }, T + .6);
  const host = document.querySelector("#sparks");
  for (let i = 0; i < 8; i++) {
    const d = document.createElement("div");
    d.style.cssText = "position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:#12372F;opacity:0";
    host.appendChild(d);
    const a = (i / 8) * Math.PI * 2;
    tl.fromTo(d, { x: 0, y: 0, opacity: 1, scale: 1 }, { x: Math.cos(a) * 140, y: Math.sin(a) * 140, opacity: 0, scale: .3, duration: .6, ease: "power3.out" }, T + 1.15);
  }
  tl.fromTo("#pill", { scale: 1 }, { scale: 1.12, duration: .18, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T + 1.15);

  T = 0.3;
  const ro = MK.rosette("#sqHost", { size: 110 });
  tl.set(ro, { x: -55, y: -55 }, 0);
  tl.fromTo("#sq", { opacity: 0, rotation: 0, scale: .4 }, { opacity: 1, rotation: 135, scale: 1, duration: .9, ease: "power3.out" }, T);
  tl.to("#sq", { rotation: 225, scale: .2, opacity: 0, duration: .5, ease: "power3.in" }, T + 1.0);
  tl.fromTo(ro, { scale: 0, rotation: -90, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: .7, ease: "back.out(2)" }, T + 1.1);
  tl.to(ro, { x: 465, y: -195, rotation: 360, duration: 1.2, ease: "power2.inOut" }, T + 1.9);

  const ph = MK.phone("#phoneHost", { w: 380, h: 780 });
  ph.screen.innerHTML = `
    <div class="scr" id="portrait" style="position:absolute;inset:0;background:linear-gradient(180deg,#0F2E29,#0B1F1C);display:flex;align-items:center;justify-content:center;font:800 54px Manrope;color:#C7F36B">9:16</div>
    <div id="landscape" style="position:absolute;left:50%;top:50%;width:${780-32}px;height:${380-32}px;margin-left:${-(780-32)/2}px;margin-top:${-(380-32)/2}px;transform:rotate(90deg);opacity:0;background:linear-gradient(90deg,#0F2E29,#12372F);display:flex;align-items:center;justify-content:center;font:800 54px Manrope;color:#F4EFE3">16:9</div>`;
  tl.set(ph.rig, { rotationX: -4, rotationY: -12, x: 0, y: -40 }, 0);
  tl.to(ph.phone, { rotationZ: -90, duration: 1.0, ease: "power3.inOut" }, 2.0);
  tl.to("#portrait", { opacity: 0, duration: .3 }, 2.35);
  tl.to("#landscape", { opacity: 1, duration: .3 }, 2.45);

  ["#g1", "#g2", "#g3"].forEach((p, i) => tl.fromTo(p,
    { opacity: 0, z: -600 + i * 120, x: (i % 2 ? 1 : -1) * 420, y: 200 - i * 90, rotationY: (i % 2 ? -1 : 1) * 30, rotationX: 12 },
    { opacity: 1, z: 0, x: 0, y: 0, rotationY: 0, rotationX: 0, duration: 1.1, ease: "power3.out" }, 1.0 + i * 0.18));
});
</script>
</body>
</html>
