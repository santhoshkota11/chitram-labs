<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Chitram kit showcase</title>
<link rel="stylesheet" href="engine/fonts.css" />
<link rel="stylesheet" href="engine/kit.css" />
<script src="engine/vendor/gsap.min.js"></script>
<style>
:root{--teal:#0B1F1C;--teal2:#0F2E29;--lime:#C7F36B;--emerald:#10B981;--cream:#F4EFE3;--forest:#12372F;--mint:#DDF5E6}
#film{background:var(--teal);font-family:"Manrope",sans-serif}
.disp{font-family:"Manrope",sans-serif;font-weight:800;letter-spacing:-.03em}
.serif{font-family:"Instrument Serif",serif;font-weight:400}
#bgTeal{background:radial-gradient(40% 50% at 82% 12%,rgba(16,185,129,.28),rgba(16,185,129,0) 70%),linear-gradient(180deg,#0F2E29,#0B1F1C 60%,#081613)}
#bgCream{background:radial-gradient(35% 45% at 12% 70%,rgba(255,230,120,.35),rgba(255,230,120,0) 70%),linear-gradient(160deg,#F4EFE3 0%,#E8F6EC 60%,#DDF5E6 100%);opacity:0}
.stack{position:absolute;left:150px;top:190px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.stack .t{position:relative;font-size:120px;line-height:1.02;color:var(--cream)}
</style>
</head>
<body>
<div id="film" data-film data-duration="16" data-fps="30" data-width="1920" data-height="1080" data-audio="assets/score.m4a">
  <div id="bgTeal" class="layer"></div>
  <div id="bgCream" class="layer"></div>
  <div id="amb" class="layer"></div>
  <div id="wall" class="layer" style="opacity:0"></div>

  <!-- S1 glitch headline + rosette -->
  <div id="s1" class="layer" data-out="3.6">
    <div class="t disp" id="g1" style="left:150px;top:400px;font-size:150px;color:var(--cream)">caption everything.</div>
    <div id="ros1" style="position:absolute;left:1560px;top:230px;width:0;height:0"></div>
  </div>

  <!-- S2 statement stack -->
  <div id="s2" class="layer" data-in="3.2" data-out="7.2">
    <div class="stack disp">
      <div class="t" id="k1">Because</div>
      <div class="t" id="k2">great</div>
      <div class="t" id="k3">captions</div>
      <div class="t" id="k4" style="color:var(--lime)">land.</div>
    </div>
    <svg id="daisy" width="520" height="520" viewBox="0 0 200 200" style="position:absolute;right:80px;bottom:40px" fill="none" stroke="#C7F36B" stroke-width="1.6" stroke-linecap="round">
      <path d="M100 100 C 88 70, 88 40, 100 18 C 112 40, 112 70, 100 100"/>
      <path d="M100 100 C 130 88, 160 88, 182 100 C 160 112, 130 112, 100 100"/>
      <path d="M100 100 C 112 130, 112 160, 100 182 C 88 160, 88 130, 100 100"/>
      <path d="M100 100 C 70 112, 40 112, 18 100 C 40 88, 70 88, 100 100"/>
      <path d="M100 100 C 118 76, 140 58, 164 48 C 154 72, 136 94, 100 100"/>
      <path d="M100 100 C 82 124, 60 142, 36 152 C 46 128, 64 106, 100 100"/>
      <circle cx="100" cy="100" r="9"/>
    </svg>
  </div>

  <!-- S3 karaoke + arc text + tube -->
  <div id="s3" class="layer" data-in="7.0" data-out="10.3">
    <svg id="tubeSvg" width="1920" height="1080" style="position:absolute;left:0;top:0"></svg>
    <div id="arcHost" class="layer"></div>
    <div class="t disp" id="kar" style="left:0;right:0;top:470px;text-align:center;font-size:96px;color:var(--cream)">every word lands on time</div>
  </div>

  <!-- S4 laptop + glass card -->
  <div id="s4" class="layer" data-in="10.0" data-out="13.2"></div>

  <!-- S5 band + phone + resolution -->
  <div id="s5" class="layer" data-in="12.9">
    <div id="bandHost" class="layer" style="perspective:1600px"></div>
    <div id="ros2" style="position:absolute;left:640px;top:520px;width:0;height:0"></div>
    <div class="t serif" id="fin" style="left:0;right:0;top:420px;text-align:center;font-size:130px;color:var(--forest)">It’s how they <span id="landWord">land</span></div>
    <div class="t" id="tag" style="left:0;right:0;top:640px;text-align:center;font:600 34px/1 Manrope;letter-spacing:.06em;color:var(--forest)">motion films from a brief</div>
  </div>

  <div id="fx" class="layer"></div>
</div>

<script src="engine/runtime.js"></script>
<script src="engine/motion-kit.js"></script>
<script>
Film.build((tl) => {
  const E = "power3.out", IO = "power2.inOut", S = "sine.inOut";
  const b = MK.bokeh("#amb", { count: 5, seed: 8, colors: ["rgba(199,243,107,.30)", "rgba(16,185,129,.35)"] });
  MK.drift(tl, b, 0, 16);

  /* S1 00:00–03:4 */
  MK.glitchIn(tl, "#g1", 0.4, { colors: ["#C7F36B", "#2EE6C9"] });
  const r1 = MK.rosette("#ros1", { size: 180, petals: 8 });
  tl.fromTo(r1, { x: 600, rotation: 0, opacity: 0 }, { x: -90, rotation: -360, opacity: 1, duration: 1.4, ease: E }, 1.1);
  MK.blurWipeOut(tl, "#g1", 2.9);

  /* S2 03:0–07:2  blob wipe in, stack */
  const cover = MK.blobWipe(tl, 2.9, { layer: "#fx", color: "#F4EFE3", dur: 1.0 });
  ["#k1", "#k2", "#k3"].forEach((s, i) => MK.blockWipe(tl, s, cover + 0.2 + i * 0.45, { color: "#F4EFE3", dur: 0.6 }));
  MK.popIn(tl, "#k4", cover + 1.6, { from: 0.5 });
  MK.lineDraw(tl, "#daisy path, #daisy circle", cover + 0.3, { dur: 1.6, stagger: 0.12 });
  MK.fadeOut(tl, ["#k1", "#k2", "#k3", "#k4"], 6.7, { dur: 0.35 });
  MK.lineErase(tl, "#daisy path, #daisy circle", 6.6);

  /* S3 07:0–10:3 */
  const tube = MK.tube("#tubeSvg", "M -40 900 C 400 700, 700 1000, 1000 760 S 1600 520, 1980 640", { width: 12 });
  MK.tubeDraw(tl, tube, 7.1, 2.2);
  const ring = MK.arcText("#arcHost", "WORD · BY · WORD · ON · TIME · ", { radius: 330, size: 34, color: "rgba(199,243,107,.8)", x: 960, y: 540, font: "700 34px Manrope" });
  tl.fromTo(ring, { rotation: 0, opacity: 0 }, { rotation: 60, opacity: 1, duration: 3, ease: "none" }, 7.1);
  tl.set("#kar", { opacity: 1 }, 7.3);
  MK.karaoke(tl, "#kar", 7.4, { step: 0.38, pill: "#C7F36B", active: "#0B1F1C", end: 9.7 });
  MK.fadeOut(tl, ["#kar", ring], 9.8, { dur: 0.35 });

  /* S4 10:0–13:2  whip to cream laptop */
  const swap = MK.whip(tl, 9.75, { layer: "#fx", colors: ["#C7F36B", "#10B981", "#F4EFE3"] });
  tl.fromTo("#bgCream", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, swap - 0.25);
  tl.set("#wall", { opacity: 1 }, swap);
  const rows = MK.typeWall("#wall", "every word", { rows: 7, font: "800 150px Manrope", color: "rgba(18,55,47,.06)" });
  MK.wallScroll(tl, rows, swap, 13.2);
  const lap = MK.laptop("#s4", { shadow: "rgba(18,55,47,.35)" });
  lap.screen.innerHTML = `<div class="scr" style="background:linear-gradient(160deg,#0F2E29,#0B1F1C);display:flex;align-items:center;justify-content:center;font:800 64px Manrope;color:#F4EFE3">Aa <span style="color:#C7F36B;margin-left:18px">captions</span></div>`;
  lap.lifts.innerHTML = `<div id="gcard" class="glass" style="position:absolute;left:330px;top:420px;width:490px;height:130px;opacity:0;display:flex;align-items:center;gap:22px;padding:0 28px;font:700 30px Manrope;color:#12372F"><span style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#C7F36B,#10B981)"></span>auto-sync</div>`;
  tl.set(lap.rig, { x: 120, y: 160, scale: 0.6, rotationX: -6, rotationY: -24 }, 0);
  tl.to(lap.rig, { rotationY: -6, x: 60, duration: 3, ease: S }, swap);
  MK.hover(tl, lap.bob, swap, 13.2);
  MK.gloss(tl, lap.glossBar, swap + 0.4);
  MK.lift(tl, "#gcard", swap + 0.8, { z: 260, x: -380, y: 140, rotationY: 14, scale: 1.1 });

  /* S5 12:9–16  blob wipe to mint, band, final line */
  const c2 = MK.blobWipe(tl, 12.6, { layer: "#fx", color: "#DDF5E6", dur: 0.9 });
  tl.set("#wall", { opacity: 0 }, c2);
  const band = MK.band("#bandHost", ["on time", "every word", "lands"], { faces: 16, radius: 900, height: 110, bg: "#C7F36B", color: "#0B1F1C", font: "800 58px Manrope", x: 960, y: 250, tilt: -14, roll: -4 });
  tl.fromTo(band, { rotationY: 0, opacity: 0 }, { rotationY: -60, opacity: 1, duration: 2.9, ease: "none" }, c2);
  const r2 = MK.rosette("#ros2", { size: 90 });
  tl.fromTo(r2, { x: -700, rotation: 0, opacity: 0 }, { x: -230, y: -45, rotation: 420, opacity: 1, duration: 1.1, ease: E }, c2 + 0.2);
  MK.blurIn(tl, "#fin", c2 + 0.5, { dur: 0.8, sweepColor: "rgba(199,243,107,.95)" });
  MK.highlight(tl, "#landWord", c2 + 1.3, { bg: "linear-gradient(90deg,#C7F36B,#10B981)" });
  MK.fadeIn(tl, "#tag", c2 + 0.7);
});
</script>
</body>
</html>
